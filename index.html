
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080e1b">

    <title>WHALE RADAR</title>

    <!-- الخط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- تصميم الواجهة -->
    <link rel="stylesheet" href="style.css">

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">

        <!-- رأس التطبيق -->
        <header class="app-header">

            <div class="logo">
                <span class="logo-icon">🐋</span>

                <div>
                    <h1>WHALE RADAR</h1>
                    <p>رادار مراقبة نشاط السوق</p>
                </div>
            </div>

            <span class="market-label">BINANCE SPOT</span>

        </header>


        <!-- إعدادات الفحص -->
        <section class="settings-section">

            <h2>إعدادات الفحص</h2>

            <div class="form-group">
                <label for="symbol">رمز العملة</label>

                <input
                    type="text"
                    id="symbol"
                    placeholder="مثال: BTC"
                    autocomplete="off"
                >
            </div>


            <div class="form-group">

                <label>الفترة الزمنية</label>

                <div class="time-options">

                    <button class="time-btn" data-period="1h">
                        1 ساعة
                    </button>

                    <button class="time-btn active" data-period="4h">
                        4 ساعات
                    </button>

                    <button class="time-btn" data-period="12h">
                        12 ساعة
                    </button>

                    <button class="time-btn" data-period="custom">
                        مخصص
                    </button>

                </div>

            </div>


            <!-- الفترة المخصصة -->
            <div id="custom-period" class="custom-period hidden">

                <div class="form-group">
                    <label for="start-date">من التاريخ والوقت</label>
                    <input type="datetime-local" id="start-date">
                </div>

                <div class="form-group">
                    <label for="end-date">إلى التاريخ والوقت</label>
                    <input type="datetime-local" id="end-date">
                </div>

            </div>


            <button id="scan-btn" class="scan-button">
                بدء فحص السوق
            </button>

        </section>


        <!-- أدوات الرادار -->
        <section class="radar-section">

            <h2>أدوات الرادار</h2>

            <div class="radar-grid">

                <button class="radar-button" data-tool="chart">
                    <span class="radar-icon">📊</span>
                    <span>شارت TradingView</span>
                </button>


                <button class="radar-button" data-tool="large-trades">
                    <span class="radar-icon">⚡</span>
                    <span>الصفقات الضخمة</span>
                </button>


                <button class="radar-button" data-tool="hidden-orders">
                    <span class="radar-icon">👁️</span>
                    <span>أنماط الأوامر المخفية المحتملة</span>
                </button>


                <button class="radar-button" data-tool="execution-clusters">
                    <span class="radar-icon">🧩</span>
                    <span>تجمعات التنفيذ</span>
                </button>


                <button class="radar-button" data-tool="capital-footprint">
                    <span class="radar-icon">🐋</span>
                    <span>بصمة نشاط رأس المال الكبير</span>
                </button>


                <button class="radar-button" data-tool="buy-sell-activity">
                    <span class="radar-icon">📈</span>
                    <span>نشاط الشراء والبيع</span>
                </button>

            </div>

        </section>


        <!-- مساحة النتائج -->
        <section id="results-section" class="results-section">

        </section>


        <!-- التذييل -->
        <footer class="app-footer">
            WHALE RADAR
            <span>Market Intelligence</span>
        </footer>

    </main>


    <!-- مشغل التطبيق -->
    <script src="app.js"></script>

</body>
</html>
